# Windows build and tests; runs on the GitHub mirror (#97), on demand:
# `gh workflow run windows.yml --ref main`. `nix run .#windows-vm -- fetch`
# puts its build in the test VM (docs/windows-vm.md).
name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with rustc from nixpkgs in flake.lock.
  RUST_VERSION: "1.98.1"
  # protoc for libsignal/presage; keep in step with protobuf from nixpkgs.
  PROTOC_VERSION: "36.2"
  PROTOC_SHA256: f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3
  # OpenSSL's assembly in the release build.
  NASM_VERSION: "3.02"
  NASM_SHA256: 161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7
  # The special OID lets an unsigned package install (docs/windows-vm.md).
  UNSIGNED_PUBLISHER: CN=Copiale, OID.2.25.311729368913984317654407730594956997722=1
  CARGO_TERM_COLOR: always
  # Vendored OpenSSL (SQLCipher) needs Strawberry Perl, not Git's.
  OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy,rustfmt
          rustup default $env:RUST_VERSION
      - name: Build tools
        run: |
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          Invoke-WebRequest $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:PROTOC_SHA256) { throw "protoc checksum mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP\protoc"
          "PROTOC=$env:RUNNER_TEMP\protoc\bin\protoc.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/ffmpeg
          key: ffmpeg-windows-${{ hashFiles('packaging/windows/ffmpeg.sh') }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          update: false
          install: make diffutils tar xz
          path-type: inherit
      - name: FFmpeg
        run: |
          # MSVC's environment, for FFmpeg's configure.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match "^([^=]+)=(.*)$") { Set-Item "env:$($Matches[1])" $Matches[2] }
          }
          $dir = msys2 -c "packaging/windows/ffmpeg.sh" | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "building FFmpeg failed" }
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --keep-going --all-targets --all-features -- -D warnings
      - name: Test
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --workspace --no-fail-fast

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - name: Build tools
        run: |
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          Invoke-WebRequest $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:PROTOC_SHA256) { throw "protoc checksum mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP\protoc"
          "PROTOC=$env:RUNNER_TEMP\protoc\bin\protoc.exe" >> $env:GITHUB_ENV
          $zip = "$env:RUNNER_TEMP\nasm.zip"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$env:NASM_VERSION/win64/nasm-$env:NASM_VERSION-win64.zip"
          Invoke-WebRequest $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:NASM_SHA256) { throw "NASM checksum mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP\nasm"
          "$env:RUNNER_TEMP\nasm\nasm-$env:NASM_VERSION" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: nasm-${{ env.NASM_VERSION }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/ffmpeg
          key: ffmpeg-windows-${{ hashFiles('packaging/windows/ffmpeg.sh') }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          update: false
          install: make diffutils tar xz
          path-type: inherit
      - name: FFmpeg
        run: |
          # MSVC's environment, for FFmpeg's configure.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match "^([^=]+)=(.*)$") { Set-Item "env:$($Matches[1])" $Matches[2] }
          }
          $dir = msys2 -c "packaging/windows/ffmpeg.sh" | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "building FFmpeg failed" }
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      - name: Build
        env:
          # Fails without NASM, rather than building without assembly.
          OPENSSL_RUST_USE_NASM: "1"
        run: cargo build --release --locked -p copiale
      - name: Check
        run: |
          $exe = "target\release\copiale.exe"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dlls = & $dumpbin.FullName /nologo /dependents $exe
          if ($dlls -match "vcruntime|msvcp|api-ms-win-crt") {
            $dlls
            throw "copiale.exe needs the Visual C++ runtime"
          }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "copiale.exe --help failed" }
      - name: Package
        run: |
          $copiale = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -EQ copiale
          packaging\windows\msix.ps1 -Exe target\release\copiale.exe -Version $copiale.version `
            -Publisher $env:UNSIGNED_PUBLISHER -Out target\msix\copiale.msix
      - name: Check the package
        run: |
          Add-AppxPackage -Path target\msix\copiale.msix -AllowUnsigned
          & "$env:LOCALAPPDATA\Microsoft\WindowsApps\copiale.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed copiale --help failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copiale.exe
          path: target/release/copiale.exe
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copiale.msix
          path: target/msix/copiale.msix
          retention-days: 30
