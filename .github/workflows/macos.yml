# macOS build and tests; runs on the GitHub mirror (#81).
name: macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with rustc from nixpkgs in flake.lock.
  RUST_VERSION: "1.98.1"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Build tools
        run: brew install protobuf # protoc for libsignal/presage
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --keep-going --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
