[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://codeberg.org/korba/copiale"
publish = false

[workspace.dependencies]
argon2 = "0.6"
copiale-core = { path = "crates/copiale-core" }
copiale-testkit = { path = "crates/copiale-testkit" }
copiale-ui = { path = "crates/copiale-ui" }
directories = "6"
futures = "0.3"
# GPUI snapshots may break the API between releases; upgrade deliberately.
gpui-kit = "=0.7.3"
keyring = "4.2"
notify = "8"
# Not on crates.io; upgrade deliberately.
presage = { git = "https://github.com/whisperfish/presage", rev = "94b3978f5456469cfd4d9f72351a5eff93715f81" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "94b3978f5456469cfd4d9f72351a5eff93715f81" }
rand = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "migrate", "macros", "runtime-tokio"] }
tempfile = "3"
thiserror = "2"
tokio = "1"
toml_edit = "0.25"
uuid = "1"
zeroize = "1"

# Same SQLCipher-enabled fork presage uses.
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# Argon2id is unusably slow unoptimized; tests derive keys.
[profile.dev.package.argon2]
opt-level = 3
