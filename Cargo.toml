[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://codeberg.org/korba/copiale"
publish = false

[workspace.dependencies]
# Encrypts attachment files; same version as libsignal's.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Zeroes its working memory; lanes run in parallel.
argon2 = { version = "0.6", features = ["parallel", "zeroize"] }
# Same version and runtime as GPUI's.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }
# Implements libsignal's store traits, which use it.
async-trait = "0.1"
# Blurred previews of images sent.
blurhash = "0.2"
chrono = "0.4"
copiale-core = { path = "crates/copiale-core" }
copiale-testkit = { path = "crates/copiale-testkit" }
copiale-ui = { path = "crates/copiale-ui" }
# Plays videos' sound.
cpal = "0.18"
directories = "6"
# Video previews' first frame and playback (`copiale --video-frame`,
# `--video-play`); same major as FFmpeg.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
# Same fontconfig-sys as GPUI's font-kit.
fontconfig = "0.10"
futures = "0.3"
gethostname = "1"
# Decodes attachments; same version as GPUI's.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Single-instance IPC: Unix sockets, Windows named pipes.
interprocess = "2.4"
# GPUI snapshots may break the API between releases; upgrade deliberately.
gpui-kit = "=0.7.3"
keyring = "4.2"
# Entry modifiers; same version as keyring uses.
keyring-core = "1"
libc = "0.2"
log = "0.4"
# UNUserNotificationCenter: replaces and closes notifications by ID.
mac-usernotifications = { version = "0.3", default-features = false }
# Content types of files sent, by name.
mime_guess = "2"
notify = "8"
notify-rust = "4.18"
# Same version as GPUI's.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
# Not on crates.io; upgrade deliberately.
presage = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c" }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
# Same version as GPUI's.
raw-window-handle = "0.6"
# Only to read libsignal-service's handshake errors; same major as it uses.
reqwest-websocket = { version = "0.6", default-features = false }
# The video frame helper's syscall filter.
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
# Same registry as async-process uses for SIGCHLD.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
serde_json = "1"
# Checks attachment digests; same version as libsignal-service uses.
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "migrate", "macros", "runtime-tokio"] }
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = "1"
toml_edit = "0.25"
# On Linux: StatusNotifierItem over D-Bus through ksni, no GTK.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Same version as fontdb uses.
ttf-parser = "0.25"
# Same versions as GPUI's text stack uses.
unicode-properties = { version = "0.1.3", default-features = false, features = ["emoji"] }
unicode-segmentation = "1.13"
url = "2.5"
uuid = "1"
# Same version as interprocess uses; its security descriptors take one.
widestring = "1.2"
# Same version as keyring's Windows store.
windows-sys = "0.61"
zeroize = "1"
# Passphrase strength; the default feature only adds a builder.
zxcvbn = { version = "3.1", default-features = false }

# Patched until upstream merges the changes; see vendor/README.md.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "vendor/libsignal-service-rs" }

[patch."https://github.com/whisperfish/presage"]
presage = { path = "vendor/presage" }

# Same SQLCipher-enabled fork presage uses.
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# Argon2id is unusably slow unoptimized; tests derive keys.
[profile.dev.package.argon2]
opt-level = 3
