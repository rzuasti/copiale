[package]
name = "copiale-core"
description = "Signal layer, models and storage for Copiale; no UI dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
async-trait.workspace = true
chrono.workspace = true
directories.workspace = true
futures.workspace = true
gethostname.workspace = true
keyring.workspace = true
keyring-core.workspace = true
notify.workspace = true
presage.workspace = true
presage-store-sqlite.workspace = true
rand.workspace = true
reqwest-websocket.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["serde"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ErrorReporting"] }

[dev-dependencies]
copiale-testkit.workspace = true
log.workspace = true
# Builds handshake errors in tests; same major as libsignal-service uses.
reqwest = { version = "0.13", default-features = false }
tempfile.workspace = true
tracing-log.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ErrorReporting", "Win32_System_Registry"] }
