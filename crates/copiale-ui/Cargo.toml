[package]
name = "copiale-ui"
description = "Views and theming for Copiale"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
copiale-core.workspace = true
futures.workspace = true
gpui-kit.workspace = true
qrcode.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tray-icon.workspace = true
unicode-properties.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
zxcvbn.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications.workspace = true
objc2-app-kit.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
fontconfig.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
