# Gruvbox Light, after github.com/morhetz/gruvbox. Tokens are described in dark.toml.
# Nudged for contrast: text_muted, accent, action, nicks.
name = "Gruvbox Light"
appearance = "light"

[colors]
background = "#fbf1c7"
sidebar = "#f2e5bc"
surface = "#ebdbb2"
border = "#d5c4a1"
text = "#3c3836"
text_secondary = "#504945"
text_muted = "#706358"
accent = "#8f6314"
accent_text = "#fbf1c7"
action = "#ab3803"
success = "#79740e"
danger = "#9d0006"
link = "#076678"
selection = "#8f63144c"
nicks = [
    "#af3a03",
    "#815c14",
    "#69640e",
    "#346d4a",
    "#076678",
    "#8f3f71",
    "#9d0006",
    "#665c54",
]
