# Built-in dark theme. Colors are #rrggbb or #rrggbbaa.
name = "Copiale Dark"
appearance = "dark"

[colors]
background = "#16181d"  # conversation pane, dialogs
sidebar = "#111317"     # chat list
surface = "#22252c"     # hovered rows, controls
border = "#2b2f37"      # dividers, rules, input outlines
text = "#d8dbe2"
text_muted = "#7d8490"  # timestamps, hints, secondary labels
accent = "#7aa2f7"      # unread markers, selected chat, primary buttons, focus
accent_text = "#0f1115" # text on accent, success and danger fills
success = "#8bc58b"     # online
danger = "#e5737a"      # errors, failed messages, offline
link = "#7dcfff"
selection = "#7aa2f74c" # selected text; translucent, as it is drawn over the text
