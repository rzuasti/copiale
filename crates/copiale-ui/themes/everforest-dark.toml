# Everforest Dark, after github.com/sainnhe/everforest. Tokens are described in dark.toml.
# Nudged for contrast: text_muted, danger, nicks.
name = "Everforest Dark"
appearance = "dark"

[colors]
background = "#2d353b"
sidebar = "#232a2e"
surface = "#343f44"
border = "#475258"
text = "#d3c6aa"
text_secondary = "#9da9a0"
text_muted = "#94a198"
accent = "#a7c080"
accent_text = "#232a2e"
action = "#dbbc7f"
success = "#83c092"
danger = "#e68082"
link = "#7fbbb3"
selection = "#a7c0804c"
nicks = [
    "#e69875",
    "#dbbc7f",
    "#a7c080",
    "#83c092",
    "#7fbbb3",
    "#d699b6",
    "#e6888a",
    "#9da9a0",
]
