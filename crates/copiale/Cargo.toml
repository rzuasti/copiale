[package]
name = "copiale"
description = "A fast, minimalist native desktop client for Signal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
copiale-core.workspace = true
copiale-ui.workspace = true
futures.workspace = true
interprocess.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
ffmpeg-next.workspace = true
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler.workspace = true

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
widestring.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
