[package]
name = "copiale"
description = "A fast, minimalist native desktop client for Signal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
copiale-core.workspace = true
copiale-ui.workspace = true
futures.workspace = true
interprocess.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
